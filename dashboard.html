<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VisionWorks | Dashboard</title>
  <link rel="icon" href="media/favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --brand: #e9528d; }
    .text-brand   { color: var(--brand); }
    .bg-brand     { background-color: var(--brand); }
    body          { font-family: 'Almarai', sans-serif; min-height: 100dvh; }

    .status-completed  { background: #22c55e22; color: #22c55e; }
    .status-skipped    { background: #f59e0b22; color: #f59e0b; }
    .status-failed     { background: #ef444422; color: #ef4444; }
    .status-in_progress { background: #3b82f622; color: #3b82f6; }

    .session-card { transition: transform .15s, box-shadow .15s; cursor: pointer; }
    .session-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px #0007; }

    .spinner {
      display: inline-block; width: 2rem; height: 2rem;
      border: 4px solid var(--brand); border-top-color: transparent;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    #modal-overlay {
      position: fixed; inset: 0; background: #000a; z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
  </style>
</head>
<body class="bg-slate-950 text-white">

  <!-- ── Nav ─────────────────────────────────────────────────────────────── -->
  <nav class="sticky top-0 w-full bg-slate-900/95 backdrop-blur border-b border-slate-800 py-3 px-4 md:px-8 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-4">

      <a href="/index.html" class="flex items-center gap-3 shrink-0">
        <img src="media/favicon.png" alt="VisionWorks" class="h-9 w-auto">
        <span class="font-black text-xl tracking-tighter">Vision<span class="text-brand">Works</span></span>
      </a>

      <div class="flex items-center gap-3 flex-wrap justify-end">
        <span id="nav-username" class="text-sm font-bold text-slate-300"></span>
        <button onclick="doLogout()"
          class="text-xs font-bold text-slate-400 hover:text-brand border border-slate-700 rounded-xl px-3 py-1.5 transition"
          data-en="Logout" data-ar="خروج">خروج</button>
        <div class="flex bg-slate-800 p-1 rounded-xl">
          <button id="btn-en" onclick="setLang('en')"
            class="text-slate-400 px-3 py-1 rounded-lg text-sm font-bold hover:text-white transition">EN</button>
          <button id="btn-ar" onclick="setLang('ar')"
            class="bg-brand text-white px-3 py-1 rounded-lg text-sm font-bold shadow transition">AR</button>
        </div>
      </div>

    </div>
  </nav>

  <!-- ── Main ─────────────────────────────────────────────────────────────── -->
  <main class="max-w-7xl mx-auto px-4 md:px-8 py-10">

    <!-- Page header -->
    <div class="mb-8">
      <h1 id="page-title" class="text-2xl md:text-3xl font-black">لوحة تحكم الفحص</h1>
      <p id="page-subtitle" class="text-slate-400 mt-1 text-sm">جلسات الفحص الخاصة بك</p>
    </div>

    <!-- Stats (hidden until data loads) -->
    <div id="stats-section" class="hidden mb-8 grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-800 rounded-2xl p-5">
        <p id="lbl-total"    class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">إجمالي الجلسات</p>
        <p id="stat-total"   class="text-3xl font-black">—</p>
      </div>
      <div class="bg-slate-800 rounded-2xl p-5">
        <p id="lbl-completed"  class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">مكتملة</p>
        <p id="stat-completed" class="text-3xl font-black text-brand">—</p>
      </div>
      <div class="bg-slate-800 rounded-2xl p-5">
        <p id="lbl-steps"   class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">إجمالي الخطوات</p>
        <p id="stat-steps"  class="text-3xl font-black">—</p>
      </div>
      <div class="bg-slate-800 rounded-2xl p-5">
        <p id="lbl-avg-dur"  class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">متوسط المدة (ث)</p>
        <p id="stat-avg-dur" class="text-3xl font-black">—</p>
      </div>
    </div>

    <!-- Loading spinner -->
    <div id="loading" class="flex flex-col items-center justify-center py-24 gap-4">
      <div class="spinner"></div>
      <p id="loading-text" class="text-slate-400 text-sm">جارٍ تحميل البيانات…</p>
    </div>

    <!-- Empty state -->
    <div id="empty" class="hidden flex flex-col items-center justify-center py-24 text-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
      <p id="empty-text" class="text-slate-400 text-lg font-bold">لا توجد جلسات فحص بعد</p>
    </div>

    <!-- Sessions list -->
    <div id="sessions-list" class="hidden space-y-4"></div>

  </main>

  <!-- ── Step-detail modal ─────────────────────────────────────────────────── -->
  <div id="modal-overlay" class="hidden" onclick="closeModal(event)">
    <div class="bg-slate-900 rounded-3xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col overflow-hidden"
         onclick="event.stopPropagation()">

      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800">
        <h2 id="modal-title" class="font-black text-lg"></h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
      </div>

      <div id="modal-body" class="overflow-y-auto p-6 space-y-3"></div>
    </div>
  </div>

  <!-- ── Script ────────────────────────────────────────────────────────────── -->
  <script>
    const API_BASE  = '';
    let currentLang = 'ar';
    let allSessions = [];

    // ── Translations ──────────────────────────────────────────────────────────
    const T = {
      'page-title':    { en: 'Inspection Dashboard',       ar: 'لوحة تحكم الفحص' },
      'page-subtitle': { en: 'Your inspection sessions',   ar: 'جلسات الفحص الخاصة بك' },
      'lbl-total':     { en: 'Total Sessions',             ar: 'إجمالي الجلسات' },
      'lbl-completed': { en: 'Completed',                  ar: 'مكتملة' },
      'lbl-steps':     { en: 'Total Steps',                ar: 'إجمالي الخطوات' },
      'lbl-avg-dur':   { en: 'Avg Duration (s)',           ar: 'متوسط المدة (ث)' },
      'loading-text':  { en: 'Loading data…',              ar: 'جارٍ تحميل البيانات…' },
      'empty-text':    { en: 'No inspection sessions yet', ar: 'لا توجد جلسات فحص بعد' },
    };

    const STATUS_LABELS = {
      completed:   { en: 'Completed',   ar: 'مكتملة' },
      skipped:     { en: 'Skipped',     ar: 'متخطاة' },
      failed:      { en: 'Failed',      ar: 'فاشلة' },
      in_progress: { en: 'In Progress', ar: 'جارية' },
    };

    // ── Language ──────────────────────────────────────────────────────────────
    function setLang(lang) {
      currentLang = lang;
      const html = document.getElementById('mainHtml');
      html.lang = lang;
      html.dir  = lang === 'ar' ? 'rtl' : 'ltr';

      document.getElementById('btn-en').className = lang === 'en'
        ? 'bg-brand text-white px-3 py-1 rounded-lg text-sm font-bold shadow transition'
        : 'text-slate-400 px-3 py-1 rounded-lg text-sm font-bold hover:text-white transition';
      document.getElementById('btn-ar').className = lang === 'ar'
        ? 'bg-brand text-white px-3 py-1 rounded-lg text-sm font-bold shadow transition'
        : 'text-slate-400 px-3 py-1 rounded-lg text-sm font-bold hover:text-white transition';

      document.querySelectorAll('[data-en]').forEach(el => {
        el.textContent = el.dataset[lang] || el.textContent;
      });

      for (const [id, texts] of Object.entries(T)) {
        const el = document.getElementById(id);
        if (el) el.textContent = texts[lang];
      }

      if (allSessions.length) renderSessions(allSessions);
    }

    // ── Auth ──────────────────────────────────────────────────────────────────
    async function init() {
      try {
        const res = await fetch(API_BASE + '/api/auth/me', { credentials: 'include' });
        if (!res.ok) { location.href = '/auth.html'; return; }
        const { user } = await res.json();
        document.getElementById('nav-username').textContent = user.name;
        loadSessions();
      } catch {
        location.href = '/auth.html';
      }
    }

    async function doLogout() {
      await fetch(API_BASE + '/api/auth/logout', { method: 'POST', credentials: 'include' });
      location.href = '/auth.html';
    }

    // ── Data ──────────────────────────────────────────────────────────────────
    async function loadSessions() {
      try {
        const res = await fetch(API_BASE + '/api/inspections', { credentials: 'include' });
        if (!res.ok) throw new Error('fetch failed');
        const { sessions } = await res.json();
        allSessions = sessions || [];
      } catch {
        allSessions = [];
      }

      document.getElementById('loading').classList.add('hidden');

      if (!allSessions.length) {
        document.getElementById('empty').classList.remove('hidden');
        return;
      }

      renderStats(allSessions);
      renderSessions(allSessions);
    }

    // ── Stats cards ───────────────────────────────────────────────────────────
    function renderStats(sessions) {
      const completed  = sessions.filter(s => s.status === 'completed').length;
      const totalSteps = sessions.reduce((a, s) => a + (s.steps?.length || 0), 0);

      const durations = sessions
        .filter(s => s.started_at && s.finished_at)
        .map(s => (new Date(s.finished_at) - new Date(s.started_at)) / 1000);
      const avgDur = durations.length
        ? Math.round(durations.reduce((a, b) => a + b, 0) / durations.length)
        : 0;

      document.getElementById('stat-total').textContent     = sessions.length;
      document.getElementById('stat-completed').textContent = completed;
      document.getElementById('stat-steps').textContent     = totalSteps;
      document.getElementById('stat-avg-dur').textContent   = avgDur;

      document.getElementById('stats-section').classList.remove('hidden');
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function statusBadge(status) {
      const label = (STATUS_LABELS[status] || { en: status, ar: status })[currentLang];
      return `<span class="text-xs font-bold px-2.5 py-1 rounded-lg status-${status}">${label}</span>`;
    }

    function fmtDate(dateStr) {
      if (!dateStr) return '—';
      return new Date(dateStr).toLocaleString(
        currentLang === 'ar' ? 'ar-EG' : 'en-GB',
        { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }
      );
    }

    function fmtDuration(start, end) {
      if (!start || !end) return '—';
      const secs = Math.round((new Date(end) - new Date(start)) / 1000);
      if (secs < 60) return currentLang === 'ar' ? `${secs} ث` : `${secs}s`;
      const m = Math.floor(secs / 60), s = secs % 60;
      return currentLang === 'ar'
        ? `${m}:${String(s).padStart(2, '0')} د`
        : `${m}:${String(s).padStart(2, '0')} m`;
    }

    // ── Session cards ─────────────────────────────────────────────────────────
    function renderSessions(sessions) {
      const list = document.getElementById('sessions-list');
      list.innerHTML = '';
      list.classList.remove('hidden');

      const L = {
        line:     { en: 'Line',             ar: 'الخط' },
        started:  { en: 'Started',          ar: 'البدء' },
        duration: { en: 'Duration',         ar: 'المدة' },
        steps:    { en: 'Steps',            ar: 'الخطوات' },
        fails:    { en: 'Failed Attempts',  ar: 'محاولات الفشل' },
        view:     { en: 'View Steps',       ar: 'عرض الخطوات' },
        session:  { en: 'Session',          ar: 'الجلسة' },
      };

      sessions.forEach(s => {
        const stepCount       = s.steps?.length || 0;
        const completedSteps  = s.steps?.filter(st => st.status === 'completed').length || 0;
        const failedAttempts  = s.steps?.reduce((a, st) => a + (st.failed_attempts || 0), 0) || 0;

        const card = document.createElement('div');
        card.className = 'bg-slate-800 rounded-2xl p-5 session-card select-none';
        card.innerHTML = `
          <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
            <div>
              <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">
                ${L.line[currentLang]} · <span class="text-white">${(s.line_id || '—').toUpperCase()}</span>
              </p>
              <p class="text-xs text-slate-500 font-mono">${L.session[currentLang]}: ${(s.session_id || '').slice(0, 20)}…</p>
            </div>
            ${statusBadge(s.status)}
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm mb-4">
            <div>
              <p class="text-slate-400 text-xs mb-0.5">${L.started[currentLang]}</p>
              <p class="font-bold text-white text-xs">${fmtDate(s.started_at)}</p>
            </div>
            <div>
              <p class="text-slate-400 text-xs mb-0.5">${L.duration[currentLang]}</p>
              <p class="font-bold text-white">${fmtDuration(s.started_at, s.finished_at)}</p>
            </div>
            <div>
              <p class="text-slate-400 text-xs mb-0.5">${L.steps[currentLang]}</p>
              <p class="font-bold text-white">${completedSteps}/${stepCount}</p>
            </div>
            <div>
              <p class="text-slate-400 text-xs mb-0.5">${L.fails[currentLang]}</p>
              <p class="font-bold ${failedAttempts > 0 ? 'text-red-400' : 'text-white'}">${failedAttempts}</p>
            </div>
          </div>

          ${stepCount > 0 ? `
          <div class="border-t border-slate-700 pt-3">
            <button class="text-brand text-xs font-bold hover:underline">
              ${L.view[currentLang]} &rarr;
            </button>
          </div>` : ''}
        `;
        card.addEventListener('click', () => openModal(s));
        list.appendChild(card);
      });
    }

    // ── Modal ─────────────────────────────────────────────────────────────────
    function openModal(session) {
      const steps = session.steps || [];
      if (!steps.length) return;

      const L = {
        title:    { en: 'Inspection Steps', ar: 'خطوات الفحص' },
        step:     { en: 'Step',             ar: 'الخطوة' },
        duration: { en: 'Duration',         ar: 'المدة' },
        screws:   { en: 'Screwdrivers',     ar: 'المفكات' },
        fails:    { en: 'Failed Attempts',  ar: 'محاولات الفشل' },
        none:     { en: 'None',             ar: 'لا شيء' },
      };

      document.getElementById('modal-title').textContent =
        `${L.title[currentLang]} · ${(session.line_id || '').toUpperCase()}`;

      document.getElementById('modal-body').innerHTML = steps.map(st => `
        <div class="bg-slate-800 rounded-xl p-4">
          <div class="flex items-center justify-between mb-3">
            <span class="font-black text-white">${L.step[currentLang]} ${st.step}</span>
            ${statusBadge(st.status)}
          </div>
          <div class="grid grid-cols-3 gap-3 text-sm">
            <div>
              <p class="text-slate-400 text-xs mb-0.5">${L.duration[currentLang]}</p>
              <p class="font-bold text-white">${fmtDuration(st.started_at, st.finished_at)}</p>
            </div>
            <div>
              <p class="text-slate-400 text-xs mb-0.5">${L.fails[currentLang]}</p>
              <p class="font-bold ${(st.failed_attempts || 0) > 0 ? 'text-red-400' : 'text-white'}">
                ${st.failed_attempts || 0}
              </p>
            </div>
            <div>
              <p class="text-slate-400 text-xs mb-0.5">${L.screws[currentLang]}</p>
              <p class="font-bold text-white text-xs">
                ${st.screwdrivers_used?.length ? st.screwdrivers_used.join(', ') : L.none[currentLang]}
              </p>
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function closeModal(e) {
      if (!e || e.target === document.getElementById('modal-overlay')) {
        document.getElementById('modal-overlay').classList.add('hidden');
      }
    }

    // Close modal on Escape
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.getElementById('modal-overlay').classList.add('hidden');
    });

    // ── Bootstrap ─────────────────────────────────────────────────────────────
    setLang('ar');
    init();
  </script>
</body>
</html>
